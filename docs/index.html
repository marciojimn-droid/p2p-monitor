<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>P2P USDT/BOB</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--ink:#101820;--mute:#5d6b78;--line:#e3e8ed;
  --up:#0a8f5b;--down:#d23a3a;--flat:#7a8794;--accent:#1d6fdc;--warn:#b7791f;
  --chip:#eef2f6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1720;--card:#17212c;--ink:#e8eef4;--mute:#93a1ae;--line:#26323f;
    --up:#35c98a;--down:#ff6b6b;--flat:#8c99a6;--accent:#5aa2ff;--warn:#f0b04a;--chip:#1f2b38}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:760px;margin:0 auto;display:grid;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px}
h1{font-size:18px;margin:0;letter-spacing:.2px}
.sub{font-size:12px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--flat);margin-right:6px}
.dot.ok{background:var(--up)}.dot.old{background:var(--warn)}.dot.bad{background:var(--down)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.price{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.price small{font-size:14px;color:var(--mute);font-weight:500;margin-left:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.badge{border-radius:12px;padding:10px 14px;text-align:center;min-width:128px}
.badge b{display:block;font-size:20px;letter-spacing:.5px}
.badge span{font-size:12px;color:var(--mute)}
.badge.ALZA{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.badge.BAJA{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.badge.ESTABLE{background:var(--chip);color:var(--ink)}
.meter{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--down),var(--chip) 50%,var(--up));margin:12px 0 4px}
.meter i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
ul.plain{margin:8px 0 0;padding-left:18px;color:var(--mute);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--mute)}
.seg{display:flex;gap:4px;margin-bottom:8px}
.seg button{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px;font:inherit;font-size:13px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
svg.chart{width:100%;height:210px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.opp{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.opp:first-of-type{border-top:0}
.opp .t{font-size:14px}.opp .d{font-size:12px;color:var(--mute)}
.opp .n{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sig{padding:9px 11px;border-radius:10px;font-size:14px;margin-top:8px;background:var(--chip)}
.sig.compra{border-left:4px solid var(--up)}.sig.venta{border-left:4px solid var(--down)}.sig.cuidado{border-left:4px solid var(--warn)}
.rsi{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--up) 0 30%,var(--chip) 30% 70%,var(--down) 70%);margin:8px 0 2px}
.rsi i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.news a{color:inherit;text-decoration:none}
.news .it{padding:9px 0;border-top:1px solid var(--line)}
.news .it:first-of-type{border-top:0}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--chip);font-weight:600}
.tag.sube{color:var(--up)}.tag.baja{color:var(--down)}
.meta{font-size:12px;color:var(--mute);margin-top:2px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input[type=number]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14px}
.err{color:var(--down);font-size:13px}
footer{font-size:12px;color:var(--mute);text-align:center;padding:6px 8px;line-height:1.6}
footer a{color:var(--accent)}
.empty{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>P2P USDT / BOB</h1><div class="sub"><span id="dot" class="dot"></span><span id="upd">cargando…</span></div></div>
    <button id="reload" class="chip" style="border:0;color:var(--ink);cursor:pointer">Actualizar</button>
  </header>

  <section class="card" id="hero"><div class="empty">Cargando datos…</div></section>

  <section class="grid2" id="plats"></section>

  <section class="card">
    <h2>Evolución del precio</h2>
    <div class="seg" id="seg"><button data-r="24h" class="on">24 h</button><button data-r="14d">14 días</button></div>
    <svg class="chart" id="chart" viewBox="0 0 700 210"></svg>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card" id="signals"></section>

  <section class="card" id="opps"></section>

  <section class="card" id="ind"></section>

  <section class="card">
    <h2>Calculadora de ganancia</h2>
    <div class="calc">
      <div><label>Capital en Bs por ciclo</label><input id="c_cap" type="number" inputmode="decimal"></div>
      <div><label>Spread bruto del ciclo (%)</label><input id="c_spr" type="number" step="0.05" inputmode="decimal" value="1"></div>
      <div><label>Comisión por operación (%)</label><input id="c_fee" type="number" step="0.05" inputmode="decimal"></div>
      <div><label>Ciclos por día</label><input id="c_cyc" type="number" inputmode="decimal" value="2"></div>
    </div>
    <div class="res" id="c_res"></div>
  </section>

  <section class="card news" id="news"></section>

  <section class="card" id="alerts"></section>

  <footer id="foot"></footer>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const nf = (v, d = 2) => (v == null || isNaN(v)) ? "—" : Number(v).toLocaleString("es-BO", {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (v, d = 2) => (v == null || isNaN(v)) ? "—" : (v > 0 ? "+" : "") + nf(v, d) + "%";
const cls = (v) => v == null ? "flat" : v > 0.02 ? "up" : v < -0.02 ? "down" : "flat";
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
  kids.flat().forEach(k => e.append(k && k.nodeType ? k : document.createTextNode(k ?? "")));
  return e;
};
const fmtTime = (iso) => new Date(iso).toLocaleString("es-BO", {timeZone: "America/La_Paz", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});

function dataBase() {
  const q = new URLSearchParams(location.search);
  let repo = q.get("repo");
  try { if (repo) localStorage.setItem("repo", repo); else repo = localStorage.getItem("repo"); } catch (e) {}
  if (!repo && location.hostname.endsWith(".github.io")) {
    const seg = location.pathname.split("/")[1];
    if (seg) repo = location.hostname.split(".")[0] + "/" + seg;
  }
  return repo ? `https://raw.githubusercontent.com/${repo}/data/` : "./data/";
}

async function getJSON(name) {
  const bust = "?t=" + Math.floor(Date.now() / 60000);
  const bases = [dataBase(), "./data/"];
  let err;
  for (const b of [...new Set(bases)]) {
    try { const r = await fetch(b + name + bust, {cache: "no-store"}); if (r.ok) return await r.json(); err = new Error(r.status); }
    catch (e) { err = e; }
  }
  throw err;
}

let LATEST = null, CHART = null, RANGE = "24h";

async function load() {
  $("upd").textContent = "actualizando…";
  try {
    [LATEST, CHART] = await Promise.all([getJSON("latest.json"), getJSON("chart.json")]);
  } catch (e) {
    $("hero").replaceChildren(el("div", {class: "err", text: "No se pudieron cargar los datos. Si es la primera vez, espera a que corra el flujo de GitHub (unos 5–10 min) o revisa el parámetro ?repo=usuario/repositorio."}));
    $("upd").textContent = "sin datos"; return;
  }
  render();
}

function render() {
  const d = LATEST;
  if (!d.platforms) { $("hero").replaceChildren(el("div", {class: "err", text: "Aún no hay datos de mercado. " + ((d.status && d.status.errors || []).slice(0, 2).join(" · ") || "Espera la próxima ejecución."})); $("upd").textContent = "sin datos"; return; }
  const age = (Date.now() - new Date(d.generated_at)) / 60000;
  $("dot").className = "dot " + (d.status && d.status.ok === false ? "bad" : age > 20 ? "old" : "ok");
  $("upd").textContent = (d.status && d.status.demo ? "DEMO · " : "") + "Actualizado " + fmtTime(d.generated_at) + (age > 20 ? ` (hace ${Math.round(age)} min)` : "");
  hero(d); platforms(d); chart(); signals(d); opps(d); indicators(d); calc(d); news(d); alerts(d); foot(d);
}

function hero(d) {
  const ta = d.ta, sc = d.scenario;
  const chips = [["30 min", ta.change_30m_pct], ["1 h", ta.change_1h_pct], ["24 h", ta.change_24h_pct]]
    .map(([l, v]) => el("span", {class: "chip"}, l + " ", el("b", {class: cls(v), text: sgn(v)})));
  const pos = Math.max(0, Math.min(100, 50 + sc.score / 2));
  $("hero").replaceChildren(
    el("div", {class: "hero"},
      el("div", {}, el("div", {class: "price"}, nf(d.price, 3), el("small", {text: "Bs / USDT"})), el("div", {class: "chips"}, chips)),
      el("div", {class: "badge " + sc.label}, el("b", {text: sc.label}), el("span", {text: `score ${sc.score > 0 ? "+" : ""}${Math.round(sc.score)} · confianza ${sc.confidence}`}))),
    (() => { const m = el("div", {class: "meter"}, el("i")); m.firstChild.style.left = pos + "%"; return m; })(),
    el("div", {class: "sub", text: "Escenario dominante a corto plazo (técnico + libros + noticias). No es una garantía."}),
    el("ul", {class: "plain"}, sc.reasons.map(r => el("li", {text: r}))));
}

function platforms(d) {
  const out = [];
  for (const [n, p] of Object.entries(d.platforms)) {
    const sp = (p.best_sell / p.best_buy - 1) * 100;
    out.push(el("div", {class: "card"}, el("h2", {text: n === "binance" ? "Binance P2P" : "Bybit P2P"}),
      el("div", {class: "kv"}, el("span", {text: "Compras USDT a"}), el("b", {text: nf(p.best_buy, n === "bybit" ? 3 : 2)})),
      el("div", {class: "kv"}, el("span", {text: "Vendes USDT a"}), el("b", {text: nf(p.best_sell, n === "bybit" ? 3 : 2)})),
      el("div", {class: "kv"}, el("span", {text: "Cruce directo"}), el("b", {class: cls(sp), text: sgn(sp)})),
      el("div", {class: "kv"}, el("span", {text: "Referencia"}), el("span", {text: nf(p.ref, 3)})),
      el("div", {class: "kv"}, el("span", {text: "USDT en anuncios (compra/venta)"}), el("span", {text: `${nf(p.vol_buy, 0)} / ${nf(p.vol_sell, 0)}`}))));
  }
  $("plats").replaceChildren(...out);
}

function chart() {
  if (!CHART) return;
  const svg = $("chart"); svg.replaceChildren();
  svg.setAttribute("viewBox", `0 0 ${Math.round(svg.clientWidth || 700)} 210`);
  const W = Math.round(svg.clientWidth || 700), H = 210, pad = {l: 8, r: 8, t: 10, b: 10};
  let series = [];
  if (RANGE === "24h") {
    const m = CHART.m5;
    series = [
      {name: "Referencia", color: "var(--accent)", pts: m.map(r => [r.t, r.br ?? r.yr]), w: 2.2},
      {name: "Binance compra", color: "var(--down)", pts: m.map(r => [r.t, r.bb]), w: 1.2},
      {name: "Binance venta", color: "var(--up)", pts: m.map(r => [r.t, r.bs]), w: 1.2},
      {name: "Bybit ref.", color: "var(--warn)", pts: m.map(r => [r.t, r.yr]), w: 1.2},
    ];
  } else {
    series = [{name: "Referencia (1 punto/hora)", color: "var(--accent)", pts: CHART.h1.map(r => [r.t, r.p]), w: 2}];
  }
  series.forEach(s => s.pts = s.pts.filter(p => p[1] != null));
  const all = series.flatMap(s => s.pts.map(p => p[1]));
  if (!all.length) return;
  const ta = LATEST.ta;
  const extra = [ta.support, ta.resistance].filter(v => v != null);
  let lo = Math.min(...all, ...(RANGE === "14d" ? extra : [])), hi = Math.max(...all, ...(RANGE === "14d" ? extra : []));
  const mg = (hi - lo) * 0.08 || 0.02; lo -= mg; hi += mg;
  const t0 = new Date(series[0].pts[0][0]).getTime(), t1 = new Date(series[0].pts[series[0].pts.length - 1][0]).getTime() || t0 + 1;
  const X = t => pad.l + (new Date(t).getTime() - t0) / Math.max(1, t1 - t0) * (W - pad.l - pad.r);
  const Y = v => pad.t + (hi - v) / (hi - lo) * (H - pad.t - pad.b);
  const ns = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.append(e); return e; };
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, y = Y(v);
    mk("line", {x1: 0, x2: W, y1: y, y2: y, stroke: "var(--line)", "stroke-width": 1});
    const t = mk("text", {x: W - 4, y: y - 3, "text-anchor": "end", "font-size": 11, fill: "var(--mute)"}); t.textContent = nf(v, 2);
  }
  if (RANGE === "14d") {
    [[ta.support, "soporte"], [ta.resistance, "resistencia"]].forEach(([v, n]) => {
      if (v == null) return;
      mk("line", {x1: 0, x2: W, y1: Y(v), y2: Y(v), stroke: "var(--mute)", "stroke-dasharray": "4 4", "stroke-width": 1});
      const t = mk("text", {x: 4, y: Y(v) - 3, "font-size": 11, fill: "var(--mute)"}); t.textContent = n + " " + nf(v, 2);
    });
  }
  series.forEach(s => {
    if (s.pts.length < 2) return;
    mk("polyline", {points: s.pts.map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" "), fill: "none", stroke: s.color, "stroke-width": s.w, "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke"});
  });
  $("legend").replaceChildren(...series.map(s => { const i = el("i"); i.style.background = s.color; return el("span", {}, i, s.name); }));
}

function signals(d) {
  const kids = [el("h2", {text: "Qué hacer ahora"})];
  if (!d.signals.length) kids.push(el("div", {class: "empty", text: "Sin señales fuertes. Mercado sin una zona clara de compra o venta."}));
  d.signals.forEach(s => kids.push(el("div", {class: "sig " + s.type, text: s.text})));
  $("signals").replaceChildren(...kids);
}

function opps(d) {
  const o = d.opportunities, kids = [el("h2", {text: "Oportunidades (netas de comisión)"})];
  const row = (t, sub, net, est) => el("div", {class: "opp"},
    el("div", {}, el("div", {class: "t", text: t}), el("div", {class: "d", text: sub})),
    el("div", {class: "n"}, el("span", {class: cls(net), text: sgn(net)}), el("div", {class: "d", text: `≈ Bs ${nf(est, 0)}`})));
  o.arbitrage.forEach(a => kids.push(row(`Arbitraje ${cap(a.buy_on)} → ${cap(a.sell_on)}`,
    `Compra ${nf(a.buy)} · vende ${nf(a.sell)} · con transferencia ${sgn(a.net_after_transfer_pct)}`, a.net_pct, a.est_bob)));
  o.taker.forEach(a => kids.push(row(`Cruce directo en ${cap(a.platform)}`, `Compra ${nf(a.buy)} · vende ${nf(a.sell)} (ejecutar anuncios existentes)`, a.net_pct, a.est_bob)));
  o.maker.forEach(a => kids.push(row(`Spread como maker en ${cap(a.platform)}`, `Publica compra ≈ ${nf(a.buy_price)} y venta ≈ ${nf(a.sell_price)}`, a.net_pct, a.est_bob)));
  kids.push(el("div", {class: "sub", style: "margin-top:8px", text: `Estimación por ciclo con Bs ${nf(d.config.capital_bob, 0)}. Comisión Binance ${d.config.fee_binance_pct}% · Bybit ${d.config.fee_bybit_pct}% por operación.`}));
  $("opps").replaceChildren(...kids);
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function indicators(d) {
  const t = d.ta, kids = [el("h2", {text: "Análisis técnico (velas de 1 h)"})];
  if (t.rsi != null) {
    const r = el("div", {class: "rsi"}, el("i")); r.firstChild.style.left = Math.max(0, Math.min(100, t.rsi)) + "%";
    kids.push(el("div", {class: "kv"}, el("span", {text: "RSI (14)"}), el("b", {text: nf(t.rsi, 0) + (t.rsi < 30 ? " · sobrevendido" : t.rsi > 70 ? " · sobrecomprado" : "")})), r);
  }
  const m = t.macd;
  if (m) kids.push(el("div", {class: "kv"}, el("span", {text: "MACD"}), el("b", {class: m.hist > 0 ? "up" : "down", text: (m.hist > 0 ? "alcista" : "bajista") + (Math.abs(m.hist) > Math.abs(m.hist_prev) ? " y acelerando" : " y perdiendo fuerza")})));
  [["EMA 20", t.ema20], ["EMA 50", t.ema50], ["Soporte (72 h)", t.support], ["Resistencia (72 h)", t.resistance]].forEach(([l, v]) => {
    if (v != null) kids.push(el("div", {class: "kv"}, el("span", {text: l}), el("span", {text: nf(v, 3)})));
  });
  const b = t.bollinger;
  if (b) kids.push(el("div", {class: "kv"}, el("span", {text: "Bandas de Bollinger"}), el("span", {text: `${nf(b.lower, 2)} – ${nf(b.upper, 2)} (precio al ${Math.round(b.pct_b * 100)}%)`})));
  if (!t.sufficient) kids.push(el("div", {class: "sub", style: "margin-top:8px", text: `Solo ${t.n_hourly} velas horarias: los indicadores se vuelven más fiables con más historial.`}));
  $("ind").replaceChildren(...kids);
}

function calc(d) {
  const cap = $("c_cap"), fee = $("c_fee");
  if (!cap.value) cap.value = d.config.capital_bob;
  if (!fee.value) fee.value = d.config.fee_binance_pct;
  const run = () => {
    const c = +cap.value || 0, s = +$("c_spr").value || 0, f = +fee.value || 0, n = +$("c_cyc").value || 0;
    const net = s - 2 * f, bs = c * net / 100;
    $("c_res").replaceChildren(
      el("div", {}, `Neto por ciclo: `, el("b", {class: cls(net), text: sgn(net)}), ` → Bs ${nf(bs, 2)}`),
      el("div", {class: "sub", text: `Por día (${n} ciclos): Bs ${nf(bs * n, 2)} · Por mes (22 días): Bs ${nf(bs * n * 22, 0)}`}),
      el("div", {class: "sub", text: `Spread mínimo para no perder: ${nf(2 * f, 2)}%`}));
  };
  ["c_cap", "c_spr", "c_fee", "c_cyc"].forEach(i => $(i).oninput = run); run();
}

function news(d) {
  const kids = [el("h2", {text: "Noticias clave: Bolivia, préstamos, petróleo y flete"})];
  if (!d.news.length) kids.push(el("div", {class: "empty", text: "Sin noticias importantes por ahora."}));
  d.news.slice(0, 8).forEach(n => {
    const dirTxt = n.direction === "sube" ? "↑ sube USD" : n.direction === "baja" ? "↓ baja USD" : "neutral";
    const a = el("a", {href: n.link, target: "_blank", rel: "noopener"},
      el("span", {class: "tag " + n.direction, text: dirTxt}), (n.important ? "⭐ " : "") + n.title);
    const meta = `${n.cat_label || ""} · ${n.source || ""}${n.n_sources > 1 ? " +" + (n.n_sources - 1) + " medios" : ""} · ${fmtTime(n.time)}`;
    kids.push(el("div", {class: "it"}, a, el("div", {class: "meta", text: meta})));
  });
  kids.push(el("div", {class: "sub", style: "margin-top:8px", text: "Solo se muestran noticias relevantes para el tipo de cambio en Bolivia. La flecha sale de palabras clave del titular: es orientativa."}));
  $("news").replaceChildren(...kids);
}

function alerts(d) {
  const kids = [el("h2", {text: "Últimas alertas enviadas"})];
  if (!d.alerts.length) kids.push(el("div", {class: "empty", text: "Aún no hay alertas."}));
  d.alerts.slice(0, 8).forEach(a => kids.push(el("div", {class: "it", style: "padding:8px 0;border-top:1px solid var(--line)"}, el("div", {class: "meta", text: fmtTime(a.t)}), el("div", {style: "white-space:pre-line;font-size:14px", text: a.text}))));
  $("alerts").replaceChildren(...kids);
}

function foot(d) {
  const f = $("foot"); f.replaceChildren();
  if (d.status && d.status.errors && d.status.errors.length) f.append(el("div", {class: "err", text: "Avisos: " + d.status.errors.slice(0, 3).join(" · ")}));
  f.append(el("div", {text: "Herramienta informativa, no es asesoría financiera. El mercado P2P puede cambiar en segundos."}));
  const s = el("div", {}, "Datos de referencia horarios: ", el("a", {href: "https://wavesoft.cloud", target: "_blank", rel: "noopener", text: "NextWave Software (wavesoft.cloud)"}), " · Anuncios: Binance P2P y Bybit P2P · Noticias: Google News.");
  f.append(s);
}

$("seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  RANGE = b.dataset.r; [...$("seg").children].forEach(x => x.classList.toggle("on", x === b)); chart();
});
$("reload").onclick = load;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
window.addEventListener("resize", () => { if (LATEST) chart(); });
setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000);
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
