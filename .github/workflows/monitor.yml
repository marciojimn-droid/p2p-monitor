name: Monitor P2P USDT-BOB

on:
  schedule:
    - cron: "*/15 * * * *"   # respaldo: si la cadena se corta, esto la reinicia (GitHub puede atrasarlo)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write
  actions: write              # para que cada ejecución arranque la siguiente

concurrency:
  group: p2p-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Marcar inicio
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El historial y el estado viven en una rama aparte ("data") que se reescribe en cada
      # ejecución con un solo commit, así el repositorio no crece con miles de commits.
      - name: Traer datos previos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datadir 2>/dev/null \
            || mkdir -p datadir
          rm -rf datadir/.git

      # Cada ejecución dura ~8 min: revisa precios y se queda escuchando Telegram para
      # responder a tus botones casi al instante y vigilar tus alertas cada minuto.
      - name: Ejecutar monitor
        timeout-minutes: 9
        env:
          LIVE_SECONDS: "420"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WAVESOFT_TOKEN: ${{ secrets.WAVESOFT_TOKEN }}
        run: python monitor.py --data datadir

      - name: Publicar datos
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd datadir
          git init -q -b data
          git config user.name "p2p-monitor"
          git config user.email "p2p-monitor@users.noreply.github.com"
          git add -A
          git commit -qm "datos $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin data

      # Cadena sin depender del reloj de GitHub: al terminar, esta ejecución lanza la siguiente.
      # (El 'sleep' evita un bucle rápido si algo fallara al instante.)
      - name: Lanzar la siguiente ejecución
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          elapsed=$(( $(date +%s) - START_TS ))
          if [ "$elapsed" -lt 240 ]; then sleep $(( 240 - elapsed )); fi
          gh workflow run monitor.yml --ref "${GITHUB_REF_NAME}" || echo "no se pudo encadenar; el cron lo reiniciará"
